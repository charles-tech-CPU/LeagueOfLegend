spring:
  application:
    name: lol-results-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/lol_results
    username: ${DB_USER:lol_user}
    password: ${DB_PASSWORD:lol_password}

  jpa:
    hibernate:
      # validate uniquement : le schema est gere par Flyway (db/migration), jamais par Hibernate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.charles.lolresults: DEBUG

app:
  cors:
    # Vite en LAN (http://<ip>:5173) et l'acces HTTPS via Tailscale (https://<machine>.<tailnet>.ts.net:<port>)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://*:5173,https://*.ts.net:[*]}
